# This workflow will build and test the Convrt macOS app using Xcode

name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and Test Xcode Project
      run: |
        xcodebuild -project Convrt.xcodeproj \
                   -scheme Convrt \
                   -sdk macosx \
                   -destination "platform=macOS" \
                   clean build test
