name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build Release App
      run: |
        xcodebuild -project Convrt.xcodeproj \
                   -scheme Convrt \
                   -sdk macosx \
                   -configuration Release \
                   clean build

    - name: Package App
      run: |
        BUILT_PRODUCTS_DIR=$(xcodebuild -project Convrt.xcodeproj -scheme Convrt -sdk macosx -configuration Release -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk -F " = " '{print $2}')
        APP_PATH="$BUILT_PRODUCTS_DIR/Convrt.app"
        
        echo "Found app at: $APP_PATH"
        
        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "Convrt-macOS.zip"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: Convrt-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
