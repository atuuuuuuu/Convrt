name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build Release App
      run: |
        xcodebuild -project Convrt.xcodeproj \
                   -scheme Convrt \
                   -sdk macosx \
                   -configuration Release \
                   -destination "generic/platform=macOS" \
                   ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
                   DEVELOPMENT_TEAM="" \
                   clean build

    - name: Package App
      run: |
        BUILT_PRODUCTS_DIR=$(xcodebuild -project Convrt.xcodeproj -scheme Convrt -sdk macosx -configuration Release -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk -F " = " '{print $2}')
        APP_PATH="$BUILT_PRODUCTS_DIR/Convrt.app"
        
        echo "Found app at: $APP_PATH"
        # Fail the release if it isn't universal (Intel Macs couldn't open the arm64-only 1.0.0).
        lipo "$APP_PATH/Contents/MacOS/Convrt" -verify_arch arm64 x86_64

        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "Convrt-macOS.zip"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: Convrt-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
